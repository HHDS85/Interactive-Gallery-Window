<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Urban Artist Club">
  <!-- Vector recreation of the Urban Artist Club badge (est. 2013).
       Drop the original artwork in here (same filename) for 1:1 fidelity. -->
  <g fill="none" stroke="#F2EFE9">
    <circle cx="60" cy="60" r="56" stroke-width="4" />
    <!-- X: ring to ring -->
    <line x1="29" y1="29" x2="91" y2="91" stroke-width="5" />
    <line x1="91" y1="29" x2="29" y2="91" stroke-width="5" />
  </g>
  <g fill="#F2EFE9" font-family="'Instrument Sans','Helvetica Neue',Arial,sans-serif">
    <defs>
      <path id="uacArcTop" d="M 12 60 A 48 48 0 0 1 108 60" />
      <path id="uacArcBottom" d="M 16 60 A 44 44 0 0 0 104 60" />
    </defs>
    <text font-size="10.5" letter-spacing="2.4" font-weight="600">
      <textPath href="#uacArcTop" startOffset="50%" text-anchor="middle">URBAN ARTIST CLUB</textPath>
    </text>
    <text font-size="9" letter-spacing="2">
      <textPath href="#uacArcBottom" startOffset="50%" text-anchor="middle">EST 2013</textPath>
    </text>
    <circle cx="15" cy="60" r="1.8" />
    <circle cx="105" cy="60" r="1.8" />
    <!-- letters: U A across the top field, C in the right field -->
    <text x="46.5" y="49" font-size="17" font-weight="600" text-anchor="middle">U</text>
    <text x="73.5" y="49" font-size="17" font-weight="600" text-anchor="middle">A</text>
    <text x="80" y="72.5" font-size="17" font-weight="600" text-anchor="middle">C</text>
  </g>
  <!-- anchor, bottom field -->
  <g transform="translate(60 80)" fill="none" stroke="#F2EFE9" stroke-width="1.9" stroke-linecap="round">
    <circle cx="0" cy="-5.6" r="2.1" />
    <line x1="0" y1="-3.5" x2="0" y2="8" />
    <line x1="-4.2" y1="-0.4" x2="4.2" y2="-0.4" />
    <path d="M -6.8 2.6 C -5.4 6.8 -3 8.6 0 9 C 3 8.6 5.4 6.8 6.8 2.6" />
    <path d="M -6.8 2.6 L -8.6 5.2" />
    <path d="M 6.8 2.6 L 8.6 5.2" />
  </g>
</svg>
